name: Tests

on:
  push:
    branches:
      - main
      - "security/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          JWT_SECRET_KEY: test-secret-key-super-long-and-safe-for-ci
          JWT_EXPIRE_MINUTES: 30
        run: |
          python -m pytest -v